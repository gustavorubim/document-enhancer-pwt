version: 2.0.0
document_type: standard
inherits: rubrics/common.yaml
common_dimensions_retained: true
criteria:
  - {criterion_id: STD-NORMATIVE-001, dimension_id: executability, requirement: "Express each requirement with a normative term, stable ID, authority, legal-entity and jurisdiction applicability, risk and control mapping, evidence, monitoring, and exception route", evidence: [requirements table], severity: blocker, hard_blocker: true}
  - {criterion_id: STD-APPLY-001, dimension_id: purpose_scope, requirement: "Define inclusions, exclusions, accountable roles, proportionality, local overlays, obligation applicability, and time-bound exceptions", evidence: [scope, requirements table, obligation mapping, exceptions], severity: high, hard_blocker: false}
  - {criterion_id: STD-ENFORCE-001, dimension_id: controls, requirement: "State control ownership, evidence integrity, monitoring thresholds, independent testing, breach response, issue remediation, escalation, and closure authority", evidence: [controls table, evidence table, enforcement section], severity: high, hard_blocker: false}
  - {criterion_id: STD-GOV-001, dimension_id: governance, requirement: "Provide accountable ownership, three-lines roles, delegated approval, independent concurrence, review triggers, attestation, version, supersession, and conformance governance", evidence: [metadata, roles table, conformance statement, version history], severity: high, hard_blocker: false}
