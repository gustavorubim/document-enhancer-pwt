criteria:
  - {criterion_id: DESK-PREREQ-001, dimension_id: dependencies, requirement: "State legal-entity scope, authorization, training, maker-checker assignment, access, authoritative inputs, tool versions, upstream status, environment, recovery readiness, and safety constraints", evidence: [scope, prerequisites, tools table], severity: high, hard_blocker: false}
  - {criterion_id: DESK-ACTION-001, dimension_id: executability, requirement: "Give stable atomic actions with operator segregation, exact input and action, expected result and tolerance, control, evidence, timing, and a next action or safe stop", evidence: [actions table, decisions table], severity: blocker, hard_blocker: true}
  - {criterion_id: DESK-RESULT-001, dimension_id: executability, requirement: "Define observable completion with maker-checker evidence, authoritative records, integrity, retention, downstream acknowledgement, and unresolved-issue status", evidence: [completion table, evidence table], severity: high, hard_blocker: false}
  - {criterion_id: DESK-RECOVERY-001, dimension_id: controls, requirement: "Define approved and prohibited branches, failure severity, safe stop, containment, impact assessment, rollback, recovery, timed escalation, notification assessment, and closure authority", evidence: [decisions table, failure paths, escalation matrix, recovery section], severity: high, hard_blocker: false}
