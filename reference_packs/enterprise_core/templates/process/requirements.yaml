schema_version: "0.1"
template_id: TPL-PROCESS-001
document_type: process
version: 1.0.0
description: Executable process template with governed lifecycle, controls, and evidence.
rendering:
  placeholder_syntax: "{{ dotted.path }}"
  missing_value: TBD
  authoring_comments: stripped
sections:
  - {id: SEC-PROC-METADATA, heading: "Document metadata and governance", order: 10, required: true, cardinality: one, expected_content: "identity, owner, status, version, dates, approvals", ontology_hooks: [DocumentIdentity, DocumentVersion, Approval], lint_rules: [governance_fields, date_format], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-PROC-PURPOSE, heading: "Purpose", order: 20, required: true, cardinality: one, expected_content: "business purpose and intended outcome", ontology_hooks: [Process, Statement], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-PROC-SCOPE, heading: "Scope and applicability", order: 30, required: true, cardinality: one, expected_content: "inclusions, exclusions, audience, jurisdiction, and tags", ontology_hooks: [Process, Requirement], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-PROC-DEFINITIONS, heading: "Definitions and controlled terminology", order: 40, required: true, cardinality: one, expected_content: "canonical terms and acronyms", ontology_hooks: [GlossaryTerm], lint_rules: [acronyms_defined, controlled_terms], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-PROC-ROLES, heading: "Roles and responsibilities", order: 50, required: true, cardinality: one, expected_content: "accountable, performing, consulted, and escalation roles", ontology_hooks: [Role, Organization, EscalationPath], lint_rules: [role_ids, accountable_role], rubric_criteria: [COM-DEPEND-001, COM-STRUCT-001]}
  - {id: SEC-PROC-PRECONDITIONS, heading: "Preconditions, triggers, and scheduling", order: 60, required: true, cardinality: one, expected_content: "trigger, cadence, preconditions, and start event", ontology_hooks: [Trigger, Precondition], lint_rules: [trigger_or_schedule], rubric_criteria: [PROC-TRIGGER-001, COM-EXEC-001]}
  - {id: SEC-PROC-INPUTS, heading: "Inputs and entry criteria", order: 70, required: true, cardinality: one, expected_content: "named inputs, owners, freshness, and entry checks", ontology_hooks: [Input, DataAsset, DataElement], lint_rules: [input_owner, input_freshness], rubric_criteria: [PROC-TRIGGER-001, COM-DEPEND-001]}
  - {id: SEC-PROC-OVERVIEW, heading: "Process overview", order: 80, required: true, cardinality: one, expected_content: "Mermaid and text overview", ontology_hooks: [Process, ProcessStep, Decision, Figure], lint_rules: [diagram_has_caption, diagram_not_authoritative_alone], rubric_criteria: [COM-EXEC-001, COM-RAG-001]}
  - {id: SEC-PROC-STEPS, heading: "Atomic process steps", order: 90, required: true, cardinality: one_or_more, expected_content: "atomic actions and expected results", ontology_hooks: [ProcessStep, Control, Evidence, CompletionCondition], lint_rules: [atomic_steps, performer, output, completion_condition], rubric_criteria: [PROC-STEP-001, COM-EXEC-001]}
  - {id: SEC-PROC-RULES, heading: "Decision rules and thresholds", order: 100, required: true, cardinality: one, expected_content: "conditions, operators, thresholds, units, branch targets, and override authority", ontology_hooks: [Rule, Decision, Metric, Threshold], lint_rules: [threshold_units, branch_targets], rubric_criteria: [PROC-DECISION-001]}
  - {id: SEC-PROC-CONTROLS, heading: "Controls, risks, and evidence", order: 110, required: true, cardinality: one, expected_content: "control objectives, risks, evidence, frequency, owners, and failure response", ontology_hooks: [Control, Risk, Evidence], lint_rules: [control_risk_link, evidence_retention], rubric_criteria: [COM-CONTROL-001, COM-DEPEND-001]}
  - {id: SEC-PROC-EXCEPTIONS, heading: "Exceptions, failure paths, escalation, and recovery", order: 120, required: true, cardinality: one, expected_content: "exception authority, failure route, recovery, and expiry", ontology_hooks: [Exception, EscalationPath, Dependency], lint_rules: [exception_authority, recovery_path], rubric_criteria: [PROC-EXCEPTION-001, COM-CONTROL-001]}
  - {id: SEC-PROC-OUTPUTS, heading: "Outputs, completion criteria, and downstream consumers", order: 130, required: true, cardinality: one, expected_content: "outputs, completion, consumers, and handoff evidence", ontology_hooks: [Output, CompletionCondition, Role, Process], lint_rules: [output_consumer, completion_evidence], rubric_criteria: [COM-EXEC-001, COM-DEPEND-001]}
  - {id: SEC-PROC-DEPENDENCIES, heading: "Systems, data, calculators, and other dependencies", order: 140, required: true, cardinality: one, expected_content: "systems, data, calculators, providers, readiness, and fallback", ontology_hooks: [System, DataAsset, Calculator, Dependency], lint_rules: [calculator_inventory, dependency_owner], rubric_criteria: [COM-DEPEND-001]}
  - {id: SEC-PROC-METRICS, heading: "Metrics, service levels, and monitoring", order: 150, required: true, cardinality: one, expected_content: "measures, units, periods, tolerance, owner, and review action", ontology_hooks: [Metric, ServiceLevel, Threshold], lint_rules: [metric_unit_period], rubric_criteria: [COM-CONTROL-001, COM-EXEC-001]}
  - {id: SEC-PROC-RELATED, heading: "Related requirements, policies, standards, and documents", order: 160, required: true, cardinality: one, expected_content: "resolved references and authority", ontology_hooks: [Requirement, Policy, Standard, DocumentIdentity], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-PROC-RETENTION, heading: "Records retention", order: 170, required: true, cardinality: one, expected_content: "records, retention basis, period, location, and review owner", ontology_hooks: [Record, Evidence, Policy], lint_rules: [retention_basis, retention_period], rubric_criteria: [COM-GOV-001, COM-CONTROL-001]}
  - {id: SEC-PROC-VERSION, heading: "Version history and approvals", order: 180, required: true, cardinality: one_or_more, expected_content: "version changes, approver, decision, and effective date", ontology_hooks: [DocumentVersion, Approval], lint_rules: [approval_record, version_history], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-PROC-ROLES, section_id: SEC-PROC-ROLES, title: Roles and accountability, required: true, columns: [{id: role_id, label: Role ID, required: true}, {id: responsibility, label: Responsibility, required: true}, {id: accountabilities, label: Accountabilities, required: true}, {id: escalation, label: Escalation path, required: true}], rubric_criteria: [COM-DEPEND-001]}
  - {id: TBL-PROC-STEPS, section_id: SEC-PROC-STEPS, title: Atomic process steps, required: true, columns: [{id: step_id, label: Step ID, required: true}, {id: performer, label: Performer, required: true}, {id: input, label: Input, required: true}, {id: action, label: Action, required: true}, {id: output, label: Output, required: true}, {id: evidence, label: Evidence, required: true}, {id: completion, label: Completion condition, required: true}, {id: failure_path, label: Failure path, required: true}], rubric_criteria: [PROC-STEP-001]}
  - {id: TBL-PROC-RULES, section_id: SEC-PROC-RULES, title: Decision rules and thresholds, required: true, columns: [{id: rule_id, label: Rule ID, required: true}, {id: condition, label: Condition, required: true}, {id: operator, label: Operator, required: true}, {id: threshold, label: Threshold and unit, required: true}, {id: outcome, label: Outcome, required: true}, {id: override, label: Override authority, required: true}], rubric_criteria: [PROC-DECISION-001]}
  - {id: TBL-PROC-CONTROLS, section_id: SEC-PROC-CONTROLS, title: Controls, risks, and evidence, required: true, columns: [{id: control_id, label: Control ID, required: true}, {id: risk_id, label: Risk ID, required: true}, {id: frequency, label: Frequency or event, required: true}, {id: owner, label: Owner, required: true}, {id: evidence, label: Evidence, required: true}, {id: failure_response, label: Failure response, required: true}], rubric_criteria: [COM-CONTROL-001]}
  - {id: TBL-PROC-EXCEPTIONS, section_id: SEC-PROC-EXCEPTIONS, title: Exceptions and recovery, required: true, columns: [{id: exception_id, label: Exception ID, required: true}, {id: trigger, label: Trigger, required: true}, {id: authority, label: Authorized role, required: true}, {id: recovery, label: Recovery, required: true}, {id: expiry, label: Valid-to or review date, required: true}], rubric_criteria: [PROC-EXCEPTION-001]}
  - {id: TBL-PROC-VERSIONS, section_id: SEC-PROC-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: date, label: Effective date, required: true}, {id: change, label: Change summary, required: true}, {id: approver, label: Approver role, required: true}, {id: decision, label: Decision, required: true}], rubric_criteria: [COM-GOV-001]}
