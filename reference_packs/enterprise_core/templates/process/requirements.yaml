schema_version: "0.1"
template_id: TPL-PROCESS-001
document_type: process
version: 2.0.0
description: Enterprise process template with legal-entity scope, three-line governance, risk-control traceability, operational resilience, and examination-ready evidence.
rendering:
  placeholder_syntax: "{{ dotted.path }}"
  missing_value: TBD
  authoring_comments: stripped
sections:
  - {id: SEC-PROC-METADATA, heading: "Document metadata and governance", order: 10, required: true, cardinality: one, expected_content: "identity, type, owner, accountable executive, status, classification, risk tier, legal entities, jurisdictions, dates, approval, repository, and supersession", ontology_hooks: [DocumentIdentity, DocumentVersion, Approval, Role, Organization], lint_rules: [governance_fields, date_format, legal_entity_scope, classification], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-PROC-PURPOSE, heading: "Purpose", order: 20, required: true, cardinality: one, expected_content: "business and risk-management purpose, intended outcome, customers or stakeholders, and decision supported", ontology_hooks: [Process, Statement], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-PROC-SCOPE, heading: "Scope and applicability", order: 30, required: true, cardinality: one, expected_content: "legal entities, jurisdictions, businesses, products, operations, populations, users, inclusions, exclusions, transition, materiality, and local overlays", ontology_hooks: [Process, Requirement, Organization], lint_rules: [scope_boundaries, legal_entity_scope], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-PROC-DEFINITIONS, heading: "Definitions and controlled terminology", order: 40, required: true, cardinality: one, expected_content: "canonical terms, acronyms, taxonomies, materiality, timing, and controlled thresholds", ontology_hooks: [GlossaryTerm], lint_rules: [acronyms_defined, controlled_terms], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-PROC-ROLES, heading: "Roles and responsibilities", order: 50, required: true, cardinality: one, expected_content: "accountable executive, business owner, performer, reviewer, approver, challenger, data and system owners, decision rights, line of defense, segregation, and escalation", ontology_hooks: [Role, Organization, EscalationPath], lint_rules: [role_ids, accountable_role, segregation_of_duties], rubric_criteria: [COM-DEPEND-001, COM-GOV-001]}
  - {id: SEC-PROC-PRECONDITIONS, heading: "Preconditions, triggers, and scheduling", order: 60, required: true, cardinality: one, expected_content: "business and system triggers, cadence, cut-off, timezone, calendar, preconditions, readiness, and start authority", ontology_hooks: [Trigger, Precondition], lint_rules: [trigger_or_schedule, timezone], rubric_criteria: [PROC-TRIGGER-001, COM-EXEC-001]}
  - {id: SEC-PROC-INPUTS, heading: "Inputs and entry criteria", order: 70, required: true, cardinality: one, expected_content: "source systems, data, documents, owners, stewards, legal-entity and period scope, freshness, classification, lineage, quality, reconciliation, and fallback", ontology_hooks: [Input, DataAsset, DataElement, System], lint_rules: [input_owner, input_freshness, lineage_complete], rubric_criteria: [PROC-TRIGGER-001, COM-DEPEND-001]}
  - {id: SEC-PROC-OVERVIEW, heading: "Process overview", order: 80, required: true, cardinality: one, expected_content: "end-to-end boundary, handoffs, decisions, controls, critical-operation context, and accessible Mermaid plus text", ontology_hooks: [Process, ProcessStep, Decision, Control, Figure], lint_rules: [diagram_has_caption, diagram_not_authoritative_alone], rubric_criteria: [COM-EXEC-001, COM-RAG-001]}
  - {id: SEC-PROC-STEPS, heading: "Atomic process steps", order: 90, required: true, cardinality: one_or_more, expected_content: "stable step IDs; performer; prerequisite; input; system; action; control; expected result; evidence; timing; completion; and failure route", ontology_hooks: [ProcessStep, Control, Evidence, CompletionCondition, System], lint_rules: [atomic_steps, performer, output, completion_condition, failure_path], rubric_criteria: [PROC-STEP-001, COM-EXEC-001]}
  - {id: SEC-PROC-RULES, heading: "Decision rules and thresholds", order: 100, required: true, cardinality: one, expected_content: "data source, period, condition, operator, threshold, unit, boundary, outcome, branch, authority, override, and evidence", ontology_hooks: [Rule, Decision, Metric, Threshold, DataAsset], lint_rules: [threshold_units, branch_targets, decision_authority], rubric_criteria: [PROC-DECISION-001]}
  - {id: SEC-PROC-CONTROLS, heading: "Controls, risks, and evidence", order: 110, required: true, cardinality: one, expected_content: "objectives, risks, obligations, control type, owners, performers, reviewers, populations, frequency, procedure, evidence, thresholds, failures, issues, and retention", ontology_hooks: [Control, Risk, Evidence, Requirement, Record], lint_rules: [control_risk_link, evidence_retention, control_population], rubric_criteria: [COM-CONTROL-001, COM-DEPEND-001]}
  - {id: SEC-PROC-EXCEPTIONS, heading: "Exceptions, failure paths, escalation, and recovery", order: 120, required: true, cardinality: one, expected_content: "scope, residual risk, compensating controls, authority, expiry, monitoring, safe stop, escalation, recovery, resumption, issue linkage, and closure", ontology_hooks: [Exception, EscalationPath, Dependency, Risk, Control], lint_rules: [exception_authority, recovery_path, expiry_required], rubric_criteria: [PROC-EXCEPTION-001, COM-CONTROL-001]}
  - {id: SEC-PROC-OUTPUTS, heading: "Outputs, completion criteria, and downstream consumers", order: 130, required: true, cardinality: one, expected_content: "outputs, legal-entity and period scope, completion, quality, approver, consumers, handoff, confidentiality, and publication evidence", ontology_hooks: [Output, CompletionCondition, Role, Process, Evidence], lint_rules: [output_consumer, completion_evidence], rubric_criteria: [COM-EXEC-001, COM-DEPEND-001]}
  - {id: SEC-PROC-DEPENDENCIES, heading: "Systems, data, calculators, and other dependencies", order: 140, required: true, cardinality: one, expected_content: "systems, data, calculators, end-user computing, models, people, facilities, third parties, subcontractors, criticality, service levels, recovery objectives, monitoring, concentration, continuity, and exit", ontology_hooks: [System, DataAsset, Calculator, Model, Dependency, Organization], lint_rules: [calculator_inventory, dependency_owner, resilience_mapping], rubric_criteria: [COM-DEPEND-001, COM-CONTROL-001]}
  - {id: SEC-PROC-METRICS, heading: "Metrics, service levels, and monitoring", order: 150, required: true, cardinality: one, expected_content: "population, formula, numerator, denominator, unit, period, source, owner, target, limit, tolerance, forum, breach action, and limitations", ontology_hooks: [Metric, ServiceLevel, Threshold, DataAsset], lint_rules: [metric_unit_period, metric_population], rubric_criteria: [COM-CONTROL-001, COM-EXEC-001]}
  - {id: SEC-PROC-RELATED, heading: "Related requirements, policies, standards, and documents", order: 160, required: true, cardinality: one, expected_content: "authority and obligation mappings by jurisdiction and legal entity, applicability conclusions, implementing steps, controls, evidence, owners, and review dates", ontology_hooks: [Requirement, Policy, Standard, DocumentIdentity, Control, Evidence], lint_rules: [references_resolve, obligation_mapping], rubric_criteria: [COM-RAG-001, COM-GOV-001]}
  - {id: SEC-PROC-RETENTION, heading: "Records retention", order: 170, required: true, cardinality: one, expected_content: "record classes, owners, systems, schedule IDs, triggers, periods, jurisdictions, legal holds, access, disposition, and retrieval testing", ontology_hooks: [Record, Evidence, Policy], lint_rules: [retention_basis, retention_period, legal_hold], rubric_criteria: [COM-GOV-001, COM-CONTROL-001]}
  - {id: SEC-PROC-VERSION, heading: "Version history and approvals", order: 180, required: true, cardinality: one_or_more, expected_content: "change class, impact, first-line ownership, independent challenge, approving authority, decision conditions, evidence, effective date, transition, and supersession", ontology_hooks: [DocumentVersion, Approval, Role, Evidence], lint_rules: [approval_record, version_history, change_classification], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-PROC-GOVERNANCE, section_id: SEC-PROC-METADATA, title: Document control, required: true, columns: [{id: document_id, label: Document ID, required: true}, {id: version, label: Version, required: true}, {id: status, label: Status, required: true}, {id: classification, label: Classification, required: true}, {id: applicability, label: Legal entities and jurisdictions, required: true}, {id: risk_tier, label: Risk tier and critical-operation link, required: true}, {id: owner, label: Business owner, required: true}, {id: executive, label: Accountable executive, required: true}, {id: authority, label: Approving authority, required: true}, {id: effective, label: Effective date, required: true}, {id: review, label: Next review date, required: true}], rubric_criteria: [COM-GOV-001]}
  - {id: TBL-PROC-ROLES, section_id: SEC-PROC-ROLES, title: "Roles, accountability, and challenge", required: true, columns: [{id: role_id, label: Role ID, required: true}, {id: governance_capacity, label: Governance capacity or line, required: true}, {id: responsibility, label: Responsibility, required: true}, {id: decision_rights, label: Decision rights, required: true}, {id: accountabilities, label: Accountabilities, required: true}, {id: escalation, label: Escalation path, required: true}], rubric_criteria: [COM-DEPEND-001, COM-GOV-001]}
  - {id: TBL-PROC-INPUTS, section_id: SEC-PROC-INPUTS, title: Governed inputs, required: true, columns: [{id: input_id, label: Input ID, required: true}, {id: system, label: System of record, required: true}, {id: scope, label: Legal-entity and period scope, required: true}, {id: owner, label: Owner and steward, required: true}, {id: freshness, label: Cut-off or freshness, required: true}, {id: quality, label: Quality and reconciliation rule, required: true}, {id: classification, label: Classification, required: true}, {id: lineage, label: Lineage or evidence, required: true}, {id: fallback, label: Fallback, required: true}], rubric_criteria: [PROC-TRIGGER-001, COM-DEPEND-001]}
  - {id: TBL-PROC-STEPS, section_id: SEC-PROC-STEPS, title: Atomic process steps, required: true, columns: [{id: step_id, label: Step ID, required: true}, {id: performer, label: Performer, required: true}, {id: prerequisite, label: Prerequisite and input, required: true}, {id: system, label: System or tool, required: true}, {id: action, label: Action, required: true}, {id: control, label: Key control ID, required: true}, {id: output, label: Output and expected result, required: true}, {id: evidence, label: Evidence, required: true}, {id: timing, label: Timing or service level, required: true}, {id: completion, label: Completion condition, required: true}, {id: failure_path, label: Failure path, required: true}], rubric_criteria: [PROC-STEP-001]}
  - {id: TBL-PROC-RULES, section_id: SEC-PROC-RULES, title: Decision rules and thresholds, required: true, columns: [{id: rule_id, label: Rule ID, required: true}, {id: source, label: Data source and period, required: true}, {id: condition, label: Condition, required: true}, {id: operator, label: Operator, required: true}, {id: threshold, label: "Threshold, unit, and boundary", required: true}, {id: outcome, label: Outcome and branch, required: true}, {id: authority, label: Decision authority, required: true}, {id: override, label: Override rule, required: true}, {id: evidence, label: Evidence, required: true}], rubric_criteria: [PROC-DECISION-001]}
  - {id: TBL-PROC-CONTROLS, section_id: SEC-PROC-CONTROLS, title: "Controls, risks, and evidence", required: true, columns: [{id: control_id, label: Control ID, required: true}, {id: objective, label: Objective and risk IDs, required: true}, {id: type, label: Type, required: true}, {id: frequency, label: Trigger or frequency, required: true}, {id: owner, label: Owner, required: true}, {id: performer, label: Performer and reviewer, required: true}, {id: population, label: Population and procedure, required: true}, {id: evidence, label: Evidence and system of record, required: true}, {id: threshold, label: Threshold, required: true}, {id: failure, label: Failure and issue response, required: true}, {id: retention, label: Retention, required: true}], rubric_criteria: [COM-CONTROL-001]}
  - {id: TBL-PROC-EXCEPTIONS, section_id: SEC-PROC-EXCEPTIONS, title: Exceptions and recovery, required: true, columns: [{id: exception_id, label: Exception ID, required: true}, {id: requirement, label: Affected requirement or control, required: true}, {id: scope, label: Trigger and scope, required: true}, {id: risk, label: Residual risk, required: true}, {id: compensating_control, label: Compensating control, required: true}, {id: owner, label: Owner, required: true}, {id: authority, label: Approval authority, required: true}, {id: expiry, label: Expiry or review date, required: true}, {id: monitoring, label: Monitoring, required: true}, {id: closure, label: Recovery and closure evidence, required: true}, {id: escalation, label: Escalation, required: true}], rubric_criteria: [PROC-EXCEPTION-001]}
  - {id: TBL-PROC-DEPENDENCIES, section_id: SEC-PROC-DEPENDENCIES, title: Dependency and resilience map, required: true, columns: [{id: dependency_id, label: Dependency ID, required: true}, {id: type_owner, label: Type and owner, required: true}, {id: purpose, label: Service or purpose, required: true}, {id: criticality, label: Criticality, required: true}, {id: data_access, label: Data and access, required: true}, {id: provider, label: Provider or subcontractor, required: true}, {id: recovery, label: Service level and recovery objectives, required: true}, {id: monitoring, label: Monitoring, required: true}, {id: continuity, label: "Continuity, substitution, or exit", required: true}], rubric_criteria: [COM-DEPEND-001, COM-CONTROL-001]}
  - {id: TBL-PROC-METRICS, section_id: SEC-PROC-METRICS, title: Metrics and escalation, required: true, columns: [{id: metric_id, label: Metric ID, required: true}, {id: definition, label: Definition and population, required: true}, {id: formula, label: Formula, required: true}, {id: unit, label: Unit and period, required: true}, {id: source, label: Data source, required: true}, {id: owner, label: Owner, required: true}, {id: threshold, label: "Target, limit, or tolerance", required: true}, {id: forum, label: Reporting forum, required: true}, {id: breach, label: Breach action, required: true}], rubric_criteria: [COM-CONTROL-001, COM-EXEC-001]}
  - {id: TBL-PROC-OBLIGATIONS, section_id: SEC-PROC-RELATED, title: Obligation and authority mapping, required: true, columns: [{id: mapping_id, label: Mapping ID, required: true}, {id: authority, label: Authority or obligation ID, required: true}, {id: applicability, label: Jurisdiction and legal entities, required: true}, {id: conclusion, label: Applicability conclusion, required: true}, {id: implementation, label: Implementing step or rule, required: true}, {id: control, label: Control and evidence, required: true}, {id: owner, label: Owner, required: true}, {id: review, label: Review date, required: true}], rubric_criteria: [COM-RAG-001, COM-GOV-001]}
  - {id: TBL-PROC-VERSIONS, section_id: SEC-PROC-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: change_class, label: Change class, required: true}, {id: date, label: Effective date, required: true}, {id: change, label: Change summary and impact, required: true}, {id: owner, label: First-line owner, required: true}, {id: challenger, label: Independent challenger, required: true}, {id: approver, label: Approving authority, required: true}, {id: decision, label: Decision and conditions, required: true}, {id: evidence, label: Evidence, required: true}, {id: supersedes, label: Supersedes, required: true}], rubric_criteria: [COM-GOV-001]}
