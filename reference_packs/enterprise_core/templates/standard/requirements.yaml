schema_version: "0.1"
template_id: TPL-STANDARD-001
document_type: standard
version: 1.0.0
description: Normative standard template with requirement IDs, applicability, enforcement, and evidence.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-STD-METADATA, heading: Document metadata and governance, order: 10, required: true, cardinality: one, expected_content: identity, version, owner, status, dates, approvals, ontology_hooks: [DocumentIdentity, DocumentVersion, Approval], lint_rules: [governance_fields], rubric_criteria: [COM-GOV-001, STD-GOV-001]}
  - {id: SEC-STD-PURPOSE, heading: Purpose, order: 20, required: true, cardinality: one, expected_content: objective and intended users, ontology_hooks: [Standard, Statement], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-STD-SCOPE, heading: Scope and applicability, order: 30, required: true, cardinality: one, expected_content: inclusions, exclusions, jurisdictions, document types, and tags, ontology_hooks: [Standard, Requirement], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001, STD-APPLY-001]}
  - {id: SEC-STD-TERMS, heading: Terms and definitions, order: 40, required: true, cardinality: one, expected_content: normative terms and canonical definitions, ontology_hooks: [GlossaryTerm], lint_rules: [normative_terms, acronyms_defined], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-STD-PRINCIPLES, heading: Standard principles, order: 50, required: true, cardinality: one, expected_content: governing principles and authority, ontology_hooks: [Standard, Policy, Requirement], lint_rules: [principles_trace], rubric_criteria: [COM-EXEC-001, STD-NORMATIVE-001]}
  - {id: SEC-STD-REQUIREMENTS, heading: Normative requirements, order: 60, required: true, cardinality: one_or_more, expected_content: MUST, MUST NOT, SHOULD, SHOULD NOT, MAY requirements with IDs, ontology_hooks: [Requirement, Rule], lint_rules: [normative_sentence, requirement_id, applicability], rubric_criteria: [STD-NORMATIVE-001, STD-APPLY-001]}
  - {id: SEC-STD-ROLES, heading: Accountable roles, order: 70, required: true, cardinality: one, expected_content: accountable, performing, approving, and escalation roles, ontology_hooks: [Role, Organization, EscalationPath], lint_rules: [role_ids, accountable_role], rubric_criteria: [COM-DEPEND-001]}
  - {id: SEC-STD-EVIDENCE, heading: Evidence and records, order: 80, required: true, cardinality: one, expected_content: evidence type, producer, location, period, and retention, ontology_hooks: [Evidence, Record], lint_rules: [evidence_metadata], rubric_criteria: [COM-CONTROL-001, STD-ENFORCE-001]}
  - {id: SEC-STD-EXCEPTIONS, heading: Exceptions and waivers, order: 90, required: true, cardinality: one, expected_content: authority, reason, expiry, review, and impact, ontology_hooks: [Exception, Approval], lint_rules: [exception_authority], rubric_criteria: [STD-APPLY-001, COM-CONTROL-001]}
  - {id: SEC-STD-ENFORCEMENT, heading: Enforcement and nonconformance, order: 100, required: true, cardinality: one, expected_content: detection, response, escalation, remediation, and evidence, ontology_hooks: [Control, Risk, EscalationPath], lint_rules: [failure_response], rubric_criteria: [STD-ENFORCE-001]}
  - {id: SEC-STD-CONTROLS, heading: Controls and monitoring, order: 110, required: true, cardinality: one, expected_content: control objectives, risks, frequency, metrics, and evidence, ontology_hooks: [Control, Risk, Metric, Threshold], lint_rules: [control_risk_link, metric_unit_period], rubric_criteria: [COM-CONTROL-001]}
  - {id: SEC-STD-RELATED, heading: "Related policies, standards, and documents", order: 120, required: true, cardinality: one, expected_content: resolved references and precedence, ontology_hooks: [Policy, Standard, Requirement, DocumentIdentity], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-STD-IMPLEMENTATION, heading: Implementation guidance, order: 130, required: true, cardinality: one, expected_content: implementation mapping and examples, ontology_hooks: [Process, Methodology, Control], lint_rules: [mapping_resolves], rubric_criteria: [COM-EXEC-001, COM-DEPEND-001]}
  - {id: SEC-STD-REVIEW, heading: Review and conformance statement, order: 140, required: true, cardinality: one, expected_content: review cadence, conformance owner, and statement, ontology_hooks: [Role, Approval, Metric], lint_rules: [review_owner], rubric_criteria: [STD-GOV-001]}
  - {id: SEC-STD-VERSION, heading: Version history and approvals, order: 150, required: true, cardinality: one_or_more, expected_content: changes, approvers, dates, and supersession, ontology_hooks: [DocumentVersion, Approval], lint_rules: [approval_record, version_history], rubric_criteria: [COM-GOV-001, STD-GOV-001]}
tables:
  - {id: TBL-STD-REQUIREMENTS, section_id: SEC-STD-REQUIREMENTS, title: Normative requirements, required: true, columns: [{id: requirement_id, label: Requirement ID, required: true}, {id: statement, label: Normative statement, required: true}, {id: applicability, label: Applicability, required: true}, {id: role, label: Accountable role, required: true}, {id: evidence, label: Evidence, required: true}, {id: exception, label: Exception path, required: true}], rubric_criteria: [STD-NORMATIVE-001]}
  - {id: TBL-STD-ROLES, section_id: SEC-STD-ROLES, title: Accountable roles, required: true, columns: [{id: role_id, label: Role ID, required: true}, {id: responsibility, label: Responsibility, required: true}, {id: approval, label: Approval authority, required: true}, {id: escalation, label: Escalation, required: true}], rubric_criteria: [COM-DEPEND-001]}
  - {id: TBL-STD-EVIDENCE, section_id: SEC-STD-EVIDENCE, title: Evidence and records, required: true, columns: [{id: evidence_id, label: Evidence ID, required: true}, {id: type, label: Type, required: true}, {id: producer, label: Producer, required: true}, {id: location, label: Storage reference, required: true}, {id: retention, label: Retention, required: true}], rubric_criteria: [STD-ENFORCE-001]}
  - {id: TBL-STD-EXCEPTIONS, section_id: SEC-STD-EXCEPTIONS, title: Exceptions and waivers, required: true, columns: [{id: exception_id, label: Exception ID, required: true}, {id: authority, label: Authority, required: true}, {id: reason, label: Reason, required: true}, {id: expiry, label: Expiry or review date, required: true}, {id: impact, label: Downstream impact, required: true}], rubric_criteria: [STD-APPLY-001]}
  - {id: TBL-STD-VERSIONS, section_id: SEC-STD-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: effective, label: Effective date, required: true}, {id: change, label: Change, required: true}, {id: approver, label: Approver, required: true}, {id: decision, label: Decision, required: true}], rubric_criteria: [STD-GOV-001]}
