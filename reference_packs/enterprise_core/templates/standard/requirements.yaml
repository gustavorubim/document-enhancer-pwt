schema_version: "0.1"
template_id: TPL-STANDARD-001
document_type: standard
version: 2.0.0
description: Enterprise banking standard template with obligation traceability, entity applicability, three-lines governance, controls, evidence, exceptions, and conformance oversight.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-STD-METADATA, heading: Document metadata and governance, order: 10, required: true, cardinality: one, expected_content: identity, version, owner, approval authority, status, dates, legal entities, jurisdictions, risk tier, classification, and system of record, ontology_hooks: [DocumentIdentity, DocumentVersion, Approval, Organization], lint_rules: [governance_fields], rubric_criteria: [COM-GOV-001, STD-GOV-001]}
  - {id: SEC-STD-PURPOSE, heading: Purpose, order: 20, required: true, cardinality: one, expected_content: objective, risk addressed, intended users, and governing authority, ontology_hooks: [Standard, Statement, Risk], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-STD-SCOPE, heading: Scope and applicability, order: 30, required: true, cardinality: one, expected_content: included and excluded legal entities, jurisdictions, businesses, products, systems, data, third parties, transition periods, and proportionality, ontology_hooks: [Standard, Requirement, Organization, System], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001, STD-APPLY-001]}
  - {id: SEC-STD-TERMS, heading: Terms and definitions, order: 40, required: true, cardinality: one, expected_content: normative terms, acronyms, canonical definitions, and source references, ontology_hooks: [GlossaryTerm], lint_rules: [normative_terms, acronyms_defined], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-STD-PRINCIPLES, heading: Standard principles, order: 50, required: true, cardinality: one, expected_content: risk-based governing principles, authority, ownership, challenge, transparency, and resilience, ontology_hooks: [Standard, Policy, Requirement, Risk], lint_rules: [principles_trace], rubric_criteria: [COM-EXEC-001, STD-NORMATIVE-001]}
  - {id: SEC-STD-REQUIREMENTS, heading: Normative requirements, order: 60, required: true, cardinality: one_or_more, expected_content: uniquely identified MUST, MUST NOT, SHOULD, SHOULD NOT, or MAY requirements traced to authority, applicability, risk, control, evidence, monitoring, and exception route, ontology_hooks: [Requirement, Rule, Risk, Control, Evidence], lint_rules: [normative_sentence, requirement_id, applicability], rubric_criteria: [STD-NORMATIVE-001, STD-APPLY-001]}
  - {id: SEC-STD-ROLES, heading: Accountable roles, order: 70, required: true, cardinality: one, expected_content: board or delegated committee, first line, second line, Internal Audit, approval authority, decision rights, independence, segregation, and escalation, ontology_hooks: [Role, Organization, EscalationPath, Approval], lint_rules: [role_ids, accountable_role], rubric_criteria: [COM-DEPEND-001, STD-GOV-001]}
  - {id: SEC-STD-EVIDENCE, heading: Evidence and records, order: 80, required: true, cardinality: one, expected_content: requirement and control linkage, evidence type, producer, entity, period, lineage, authoritative location, integrity, retention, legal hold, and access, ontology_hooks: [Evidence, Record, Requirement, Control, Organization], lint_rules: [evidence_metadata], rubric_criteria: [COM-CONTROL-001, STD-ENFORCE-001]}
  - {id: SEC-STD-EXCEPTIONS, heading: Exceptions and waivers, order: 90, required: true, cardinality: one, expected_content: affected requirements, authority, independent concurrence, risk acceptance, compensating controls, expiry, remediation, downstream impact, and disclosure, ontology_hooks: [Exception, Approval, Risk, Control], lint_rules: [exception_authority], rubric_criteria: [STD-APPLY-001, COM-CONTROL-001]}
  - {id: SEC-STD-ENFORCEMENT, heading: Enforcement and nonconformance, order: 100, required: true, cardinality: one, expected_content: detection, classification, containment, issue ownership, remediation, escalation, consequence management, regulatory assessment, and evidence, ontology_hooks: [Control, Risk, EscalationPath, Record, Evidence], lint_rules: [failure_response], rubric_criteria: [STD-ENFORCE-001]}
  - {id: SEC-STD-CONTROLS, heading: Controls and monitoring, order: 110, required: true, cardinality: one, expected_content: requirement and risk mapping, control objective, owner, operator, frequency, procedure, evidence, metric, threshold, breach response, and independent testing, ontology_hooks: [Control, Risk, Metric, Threshold, Evidence, Role], lint_rules: [control_risk_link, metric_unit_period], rubric_criteria: [COM-CONTROL-001, STD-ENFORCE-001]}
  - {id: SEC-STD-RELATED, heading: "Related policies, standards, and documents", order: 120, required: true, cardinality: one, expected_content: resolved authoritative references, dependencies, conflicts, precedence, and superseded documents, ontology_hooks: [Policy, Standard, Requirement, DocumentIdentity, Dependency], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-STD-IMPLEMENTATION, heading: Implementation guidance, order: 130, required: true, cardinality: one, expected_content: implementation mapping, risk-tier proportionality, transition plan, training, technology and third-party considerations, and examples clearly separated from requirements, ontology_hooks: [Process, Methodology, Control, System, Dependency, Organization], lint_rules: [mapping_resolves], rubric_criteria: [COM-EXEC-001, COM-DEPEND-001]}
  - {id: SEC-STD-OBLIGATIONS, heading: Regulatory and policy obligation mapping, order: 140, required: true, cardinality: one, expected_content: obligation source, citation or internal reference, interpretation, entity and jurisdiction applicability, implementing requirement or control, evidence owner, and Legal or Compliance validation, ontology_hooks: [Requirement, Policy, Standard, Organization, Control, Evidence], lint_rules: [references_resolve, applicability], rubric_criteria: [COM-RAG-001, COM-GOV-001, STD-APPLY-001]}
  - {id: SEC-STD-REVIEW, heading: Review and conformance statement, order: 150, required: true, cardinality: one, expected_content: review cadence, event triggers, conformance owner, attestation population, reporting forum, and explicit conformance status, ontology_hooks: [Role, Approval, Metric, Trigger], lint_rules: [review_owner], rubric_criteria: [STD-GOV-001]}
  - {id: SEC-STD-VERSION, heading: Version history and approvals, order: 160, required: true, cardinality: one_or_more, expected_content: changes, impact assessment, owner, independent concurrence, approval authority, dates, and supersession, ontology_hooks: [DocumentVersion, Approval, Role], lint_rules: [approval_record, version_history], rubric_criteria: [COM-GOV-001, STD-GOV-001]}
tables:
  - {id: TBL-STD-GOVERNANCE, section_id: SEC-STD-METADATA, title: Governance metadata, required: true, columns: [{id: field, label: Governance field, required: true}, {id: value, label: Required value, required: true}, {id: role, label: Accountable role, required: true}, {id: evidence, label: Evidence or system of record, required: true}], rubric_criteria: [COM-GOV-001, STD-GOV-001]}
  - {id: TBL-STD-REQUIREMENTS, section_id: SEC-STD-REQUIREMENTS, title: Normative requirements, required: true, columns: [{id: requirement_id, label: Requirement ID, required: true}, {id: authority, label: Authority or obligation, required: true}, {id: statement, label: Normative statement, required: true}, {id: applicability, label: Entity jurisdiction and applicability, required: true}, {id: role, label: Accountable role, required: true}, {id: risk_control, label: Risk and control, required: true}, {id: evidence_monitoring, label: Evidence and monitoring, required: true}, {id: exception, label: Exception path, required: true}], rubric_criteria: [STD-NORMATIVE-001, STD-APPLY-001]}
  - {id: TBL-STD-ROLES, section_id: SEC-STD-ROLES, title: Accountable roles, required: true, columns: [{id: role_id, label: Role ID, required: true}, {id: capacity, label: Line or capacity, required: true}, {id: responsibility, label: Responsibility, required: true}, {id: authority, label: Decision or approval authority, required: true}, {id: independence, label: Independence or segregation requirement, required: true}, {id: escalation, label: Escalation, required: true}], rubric_criteria: [COM-DEPEND-001, STD-GOV-001]}
  - {id: TBL-STD-EVIDENCE, section_id: SEC-STD-EVIDENCE, title: Evidence and records, required: true, columns: [{id: evidence_id, label: Evidence ID, required: true}, {id: linkage, label: Requirement and control, required: true}, {id: type_producer, label: Type and producer, required: true}, {id: period_entity, label: Period and legal entity, required: true}, {id: storage_integrity, label: Authoritative storage and integrity, required: true}, {id: retention_hold, label: Retention and hold, required: true}, {id: access_owner, label: Access owner, required: true}], rubric_criteria: [STD-ENFORCE-001, COM-CONTROL-001]}
  - {id: TBL-STD-EXCEPTIONS, section_id: SEC-STD-EXCEPTIONS, title: Exceptions and waivers, required: true, columns: [{id: exception_id, label: Exception ID, required: true}, {id: requirements, label: Requirements affected, required: true}, {id: authority, label: Authority and second-line concurrence, required: true}, {id: risk_reason, label: Risk and reason, required: true}, {id: controls, label: Compensating controls, required: true}, {id: expiry, label: Expiry or review date, required: true}, {id: impact, label: Downstream impact and disclosure, required: true}], rubric_criteria: [STD-APPLY-001, COM-CONTROL-001]}
  - {id: TBL-STD-CONTROLS, section_id: SEC-STD-CONTROLS, title: Controls and monitoring, required: true, columns: [{id: control_id, label: Control ID, required: true}, {id: mapping, label: Requirements and risks, required: true}, {id: ownership, label: Owner and operator, required: true}, {id: frequency, label: Frequency, required: true}, {id: procedure, label: Procedure and evidence, required: true}, {id: monitoring, label: Metric threshold and breach response, required: true}, {id: testing, label: Independent testing, required: true}], rubric_criteria: [COM-CONTROL-001, STD-ENFORCE-001]}
  - {id: TBL-STD-OBLIGATIONS, section_id: SEC-STD-OBLIGATIONS, title: Regulatory and policy obligation mapping, required: true, columns: [{id: obligation_id, label: Obligation ID, required: true}, {id: authority, label: Authority or source, required: true}, {id: citation, label: Citation or internal reference, required: true}, {id: interpretation, label: Interpretation and applicability, required: true}, {id: implementation, label: Implementing requirement or control, required: true}, {id: owner, label: Evidence owner, required: true}, {id: validation, label: Legal or Compliance validation, required: true}], rubric_criteria: [COM-RAG-001, COM-GOV-001, STD-APPLY-001]}
  - {id: TBL-STD-VERSIONS, section_id: SEC-STD-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: effective, label: Effective date, required: true}, {id: change, label: Change and impact assessment, required: true}, {id: owner, label: Content owner, required: true}, {id: concurrence, label: Risk or Compliance concurrence, required: true}, {id: approver, label: Approval authority, required: true}, {id: supersedes, label: Supersedes, required: true}], rubric_criteria: [STD-GOV-001, COM-GOV-001]}
