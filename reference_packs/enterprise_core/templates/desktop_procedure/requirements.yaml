schema_version: "0.1"
template_id: TPL-DESKTOP-001
document_type: desktop_procedure
version: 1.0.0
description: Safe desktop procedure template with prerequisites, atomic actions, expected results, and recovery.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-DESK-METADATA, heading: Document metadata and governance, order: 10, required: true, cardinality: one, expected_content: identity, version, owner, status, dates, approvals, ontology_hooks: [DocumentIdentity, DocumentVersion, Approval], lint_rules: [governance_fields], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-DESK-PURPOSE, heading: Purpose, order: 20, required: true, cardinality: one, expected_content: task outcome and intended operator, ontology_hooks: [DesktopProcedure, Statement], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-DESK-SCOPE, heading: Scope and applicability, order: 30, required: true, cardinality: one, expected_content: supported environment, exclusions, and audience, ontology_hooks: [DesktopProcedure, Limitation], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001, DESK-PREREQ-001]}
  - {id: SEC-DESK-PREREQS, heading: Prerequisites, order: 40, required: true, cardinality: one, expected_content: access, data, permissions, and starting state, ontology_hooks: [Precondition, Input, Role], lint_rules: [prerequisites_explicit], rubric_criteria: [DESK-PREREQ-001]}
  - {id: SEC-DESK-ACCESS, heading: Access and environment, order: 50, required: true, cardinality: one, expected_content: approved account, environment, confidentiality, and session handling, ontology_hooks: [Role, System, Requirement], lint_rules: [least_privilege, environment], rubric_criteria: [DESK-PREREQ-001, COM-CONTROL-001]}
  - {id: SEC-DESK-TOOLS, heading: Tools and inputs, order: 60, required: true, cardinality: one, expected_content: tool versions, input files, calculators, and dependencies, ontology_hooks: [System, Calculator, Input, Dependency], lint_rules: [tool_versions, calculator_inventory], rubric_criteria: [DESK-PREREQ-001, COM-DEPEND-001]}
  - {id: SEC-DESK-SAFETY, heading: Safety and data handling, order: 70, required: true, cardinality: one, expected_content: prohibited actions, data handling, and safe stop, ontology_hooks: [Control, Risk, Requirement], lint_rules: [safety_warning, data_handling], rubric_criteria: [COM-CONTROL-001, DESK-RECOVERY-001]}
  - {id: SEC-DESK-ACTIONS, heading: Atomic actions, order: 80, required: true, cardinality: one_or_more, expected_content: numbered action, expected result, evidence, and next action, ontology_hooks: [ProcessStep, Evidence, CompletionCondition], lint_rules: [numbered_actions, expected_result], rubric_criteria: [DESK-ACTION-001, COM-EXEC-001]}
  - {id: SEC-DESK-DECISIONS, heading: Decisions and branching, order: 90, required: true, cardinality: one, expected_content: conditions, choices, and branch targets, ontology_hooks: [Decision, Rule], lint_rules: [branch_targets], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: SEC-DESK-EVIDENCE, heading: Evidence capture, order: 100, required: true, cardinality: one, expected_content: evidence type, naming, storage, and retention, ontology_hooks: [Evidence, Record], lint_rules: [evidence_metadata], rubric_criteria: [DESK-RESULT-001, COM-CONTROL-001]}
  - {id: SEC-DESK-FAILURE, heading: Failure paths, order: 110, required: true, cardinality: one, expected_content: failure symptom, safe stop, diagnosis, and escalation, ontology_hooks: [Exception, EscalationPath, Risk], lint_rules: [failure_path], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: SEC-DESK-ROLLBACK, heading: Rollback and recovery, order: 120, required: true, cardinality: one, expected_content: reversible actions, restore point, and validation, ontology_hooks: [Dependency, CompletionCondition, Evidence], lint_rules: [rollback_steps], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: SEC-DESK-ESCALATION, heading: Escalation, order: 130, required: true, cardinality: one, expected_content: escalation roles, severity, timing, and handoff evidence, ontology_hooks: [EscalationPath, Role, Evidence], lint_rules: [escalation_owner], rubric_criteria: [DESK-RECOVERY-001, COM-DEPEND-001]}
  - {id: SEC-DESK-COMPLETION, heading: Completion criteria, order: 140, required: true, cardinality: one, expected_content: observable success state, outputs, and downstream handoff, ontology_hooks: [CompletionCondition, Output, Role], lint_rules: [completion_observable], rubric_criteria: [DESK-RESULT-001, COM-EXEC-001]}
  - {id: SEC-DESK-RELATED, heading: "Related requirements, controls, and documents", order: 150, required: true, cardinality: one, expected_content: resolved references and controls, ontology_hooks: [Requirement, Control, DocumentIdentity], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-DESK-VERSION, heading: Version history and approvals, order: 160, required: true, cardinality: one_or_more, expected_content: changes, approvers, dates, and supersession, ontology_hooks: [DocumentVersion, Approval], lint_rules: [approval_record, version_history], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-DESK-TOOLS, section_id: SEC-DESK-TOOLS, title: Tools and inputs, required: true, columns: [{id: tool_id, label: Tool or input ID, required: true}, {id: version, label: Version, required: true}, {id: owner, label: Owner, required: true}, {id: purpose, label: Purpose, required: true}, {id: fallback, label: Fallback, required: true}], rubric_criteria: [DESK-PREREQ-001]}
  - {id: TBL-DESK-ACTIONS, section_id: SEC-DESK-ACTIONS, title: Atomic actions and expected results, required: true, columns: [{id: action_id, label: Action ID, required: true}, {id: operator, label: Operator, required: true}, {id: action, label: Action, required: true}, {id: expected, label: Expected result, required: true}, {id: evidence, label: Evidence, required: true}, {id: next, label: Next action, required: true}], rubric_criteria: [DESK-ACTION-001]}
  - {id: TBL-DESK-FAILURE, section_id: SEC-DESK-FAILURE, title: Failure paths, required: true, columns: [{id: failure_id, label: Failure ID, required: true}, {id: symptom, label: Symptom, required: true}, {id: stop, label: Safe stop, required: true}, {id: recovery, label: Recovery, required: true}, {id: escalate, label: Escalation, required: true}], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: TBL-DESK-EVIDENCE, section_id: SEC-DESK-EVIDENCE, title: Evidence capture, required: true, columns: [{id: evidence_id, label: Evidence ID, required: true}, {id: type, label: Type, required: true}, {id: producer, label: Producer, required: true}, {id: storage, label: Storage reference, required: true}, {id: retention, label: Retention, required: true}], rubric_criteria: [DESK-RESULT-001]}
  - {id: TBL-DESK-VERSIONS, section_id: SEC-DESK-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: effective, label: Effective date, required: true}, {id: change, label: Change, required: true}, {id: approver, label: Approver, required: true}], rubric_criteria: [COM-GOV-001]}
