schema_version: "0.1"
template_id: TPL-DESKTOP-001
document_type: desktop_procedure
version: 2.0.0
description: Enterprise banking desktop procedure template with maker-checker execution, access control, authoritative evidence, safe stops, resilience, timed escalation, and obligation traceability.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-DESK-METADATA, heading: Document metadata and governance, order: 10, required: true, cardinality: one, expected_content: identity, version, owner, approval authority, status, dates, entities, jurisdictions, classification, criticality, and system of record, ontology_hooks: [DocumentIdentity, DocumentVersion, Approval, Organization], lint_rules: [governance_fields], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-DESK-PURPOSE, heading: Purpose, order: 20, required: true, cardinality: one, expected_content: controlled outcome, intended operator, customer or reporting impact, and risk addressed, ontology_hooks: [DesktopProcedure, Statement, Risk], lint_rules: [purpose_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-DESK-SCOPE, heading: Scope and applicability, order: 30, required: true, cardinality: one, expected_content: legal entities, jurisdictions, businesses, supported environments, execution windows, exclusions, audience, and local overlays, ontology_hooks: [DesktopProcedure, Limitation, Organization], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001, DESK-PREREQ-001]}
  - {id: SEC-DESK-PREREQS, heading: Prerequisites, order: 40, required: true, cardinality: one, expected_content: authorization, training, maker-checker assignment, approved inputs, upstream status, permissions, recovery readiness, and starting state, ontology_hooks: [Precondition, Input, Role, Approval, Dependency], lint_rules: [prerequisites_explicit], rubric_criteria: [DESK-PREREQ-001, COM-DEPEND-001]}
  - {id: SEC-DESK-ACCESS, heading: Access and environment, order: 50, required: true, cardinality: one, expected_content: named account, least privilege, privileged or emergency access, approved device and environment, confidentiality, session handling, recertification, and prohibited access, ontology_hooks: [Role, System, Requirement, Control], lint_rules: [least_privilege, environment], rubric_criteria: [DESK-PREREQ-001, COM-CONTROL-001]}
  - {id: SEC-DESK-TOOLS, heading: Tools and inputs, order: 60, required: true, cardinality: one, expected_content: controlled tool version, authoritative input, owner, classification, entity, purpose, integrity check, availability, fallback, calculator, and dependency, ontology_hooks: [System, Calculator, Input, Dependency, Organization], lint_rules: [tool_versions, calculator_inventory], rubric_criteria: [DESK-PREREQ-001, COM-DEPEND-001]}
  - {id: SEC-DESK-SAFETY, heading: Safety and data handling, order: 70, required: true, cardinality: one, expected_content: prohibited actions, confidentiality, privacy, secrecy, data minimization, secure transfer, safe stop, customer protection, and evidence requirements, ontology_hooks: [Control, Risk, Requirement], lint_rules: [safety_warning, data_handling], rubric_criteria: [COM-CONTROL-001, DESK-RECOVERY-001]}
  - {id: SEC-DESK-ACTIONS, heading: Atomic actions, order: 80, required: true, cardinality: one_or_more, expected_content: uniquely identified operator action, segregation, exact inputs, expected result, tolerance, control, evidence, time objective, next step, and safe stop, ontology_hooks: [ProcessStep, Evidence, CompletionCondition, Control, Threshold, Role], lint_rules: [numbered_actions, expected_result], rubric_criteria: [DESK-ACTION-001, COM-EXEC-001]}
  - {id: SEC-DESK-DECISIONS, heading: Decisions and branching, order: 90, required: true, cardinality: one, expected_content: uniquely identified condition, authoritative input, decision owner, permitted branch, prohibited branch, evidence, and escalation, ontology_hooks: [Decision, Rule, Role, Evidence, EscalationPath], lint_rules: [branch_targets], rubric_criteria: [DESK-RECOVERY-001, DESK-ACTION-001]}
  - {id: SEC-DESK-EVIDENCE, heading: Evidence capture, order: 100, required: true, cardinality: one, expected_content: action decision and control linkage, type, producer, period, entity, authoritative location, integrity, retention, legal hold, reviewer, and screenshot limitations, ontology_hooks: [Evidence, Record, ProcessStep, Control, Organization], lint_rules: [evidence_metadata], rubric_criteria: [DESK-RESULT-001, COM-CONTROL-001]}
  - {id: SEC-DESK-FAILURE, heading: Failure paths, order: 110, required: true, cardinality: one, expected_content: failure ID, severity, symptom, trigger, safe stop, containment, recovery, impact assessment, escalation time, evidence, issue linkage, and closure authority, ontology_hooks: [Exception, EscalationPath, Risk, Evidence, Record], lint_rules: [failure_path], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: SEC-DESK-ROLLBACK, heading: Rollback and recovery, order: 120, required: true, cardinality: one, expected_content: reversible and irreversible actions, restore point, data reconciliation, recovery objective, validation, approval, and evidence, ontology_hooks: [Dependency, CompletionCondition, Evidence, Approval, Control], lint_rules: [rollback_steps], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: SEC-DESK-ESCALATION, heading: Escalation, order: 130, required: true, cardinality: one, expected_content: severity or trigger, notification roles, target time, handoff evidence, decision authority, incident or issue linkage, and Legal or Compliance assessment, ontology_hooks: [EscalationPath, Role, Evidence, Approval, Record], lint_rules: [escalation_owner], rubric_criteria: [DESK-RECOVERY-001, COM-DEPEND-001]}
  - {id: SEC-DESK-COMPLETION, heading: Completion criteria, order: 140, required: true, cardinality: one, expected_content: observable success state, tolerance, outputs, evidence, maker, checker, approval, downstream handoff, status, and unresolved issue confirmation, ontology_hooks: [CompletionCondition, Output, Role, Evidence, Approval], lint_rules: [completion_observable], rubric_criteria: [DESK-RESULT-001, COM-EXEC-001]}
  - {id: SEC-DESK-RELATED, heading: "Related requirements, controls, and documents", order: 150, required: true, cardinality: one, expected_content: resolved upstream and downstream requirements, controls, standards, processes, recovery plans, and precedence, ontology_hooks: [Requirement, Control, DocumentIdentity, Dependency], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-DESK-OBLIGATIONS, heading: Regulatory and policy obligation mapping, order: 160, required: true, cardinality: one, expected_content: obligation source, citation or internal reference, applicability, implementing action or control, evidence owner, and Legal or Compliance validation, ontology_hooks: [Requirement, Policy, Standard, Organization, ProcessStep, Control, Evidence], lint_rules: [references_resolve, applicability], rubric_criteria: [COM-RAG-001, COM-GOV-001]}
  - {id: SEC-DESK-VERSION, heading: Version history and approvals, order: 170, required: true, cardinality: one_or_more, expected_content: change, operational impact, owner, independent concurrence, approval authority, effective date, and supersession, ontology_hooks: [DocumentVersion, Approval, Role], lint_rules: [approval_record, version_history], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-DESK-GOVERNANCE, section_id: SEC-DESK-METADATA, title: Governance metadata, required: true, columns: [{id: field, label: Governance field, required: true}, {id: value, label: Required value, required: true}, {id: role, label: Accountable role, required: true}, {id: evidence, label: Evidence or system of record, required: true}], rubric_criteria: [COM-GOV-001]}
  - {id: TBL-DESK-TOOLS, section_id: SEC-DESK-TOOLS, title: Tools and inputs, required: true, columns: [{id: tool_id, label: Tool or input ID, required: true}, {id: version, label: Approved version or as-of date, required: true}, {id: source, label: Owner and authoritative source, required: true}, {id: classification, label: Classification and legal entity, required: true}, {id: purpose, label: Purpose and integrity check, required: true}, {id: fallback, label: Availability or fallback, required: true}], rubric_criteria: [DESK-PREREQ-001, COM-DEPEND-001]}
  - {id: TBL-DESK-ACTIONS, section_id: SEC-DESK-ACTIONS, title: Atomic actions and expected results, required: true, columns: [{id: action_id, label: Action ID, required: true}, {id: operator, label: Operator and segregation, required: true}, {id: action, label: Exact action, required: true}, {id: expected, label: Expected result and tolerance, required: true}, {id: control_evidence, label: Control and evidence, required: true}, {id: objective, label: Time or service objective, required: true}, {id: next, label: Next action or safe stop, required: true}], rubric_criteria: [DESK-ACTION-001, COM-EXEC-001]}
  - {id: TBL-DESK-DECISIONS, section_id: SEC-DESK-DECISIONS, title: Decisions and branching, required: true, columns: [{id: decision_id, label: Decision ID, required: true}, {id: condition, label: Condition and authoritative input, required: true}, {id: owner, label: Decision owner, required: true}, {id: approved, label: Approved branch, required: true}, {id: prohibited, label: Prohibited branch, required: true}, {id: evidence, label: Evidence and escalation, required: true}], rubric_criteria: [DESK-RECOVERY-001, DESK-ACTION-001]}
  - {id: TBL-DESK-EVIDENCE, section_id: SEC-DESK-EVIDENCE, title: Evidence capture, required: true, columns: [{id: evidence_id, label: Evidence ID, required: true}, {id: linkage, label: Action decision and control, required: true}, {id: type_producer, label: Type and producer, required: true}, {id: period_entity, label: Period and legal entity, required: true}, {id: storage_integrity, label: Authoritative storage and integrity, required: true}, {id: retention_hold, label: Retention and hold, required: true}, {id: reviewer, label: Reviewer, required: true}], rubric_criteria: [DESK-RESULT-001, COM-CONTROL-001]}
  - {id: TBL-DESK-FAILURE, section_id: SEC-DESK-FAILURE, title: Failure paths, required: true, columns: [{id: failure_id, label: Failure ID and severity, required: true}, {id: symptom, label: Symptom or trigger, required: true}, {id: stop, label: Immediate safe stop and containment, required: true}, {id: recovery, label: Recovery owner and steps, required: true}, {id: impact, label: Data customer reporting and downstream assessment, required: true}, {id: escalate, label: Escalation time and role, required: true}, {id: closure, label: Evidence and closure authority, required: true}], rubric_criteria: [DESK-RECOVERY-001]}
  - {id: TBL-DESK-ESCALATION, section_id: SEC-DESK-ESCALATION, title: Escalation matrix, required: true, columns: [{id: escalation_id, label: Escalation ID, required: true}, {id: trigger, label: Severity or trigger, required: true}, {id: notify, label: Notify, required: true}, {id: timing, label: Target time, required: true}, {id: evidence, label: Required handoff evidence, required: true}, {id: authority, label: Decision authority, required: true}, {id: external, label: External notification assessment, required: true}], rubric_criteria: [DESK-RECOVERY-001, COM-DEPEND-001]}
  - {id: TBL-DESK-COMPLETION, section_id: SEC-DESK-COMPLETION, title: Completion criteria, required: true, columns: [{id: completion_id, label: Completion ID, required: true}, {id: condition, label: Observable condition and tolerance, required: true}, {id: evidence, label: Evidence, required: true}, {id: maker, label: Maker, required: true}, {id: checker, label: Checker or approver, required: true}, {id: handoff, label: Downstream handoff and status, required: true}], rubric_criteria: [DESK-RESULT-001, COM-EXEC-001]}
  - {id: TBL-DESK-OBLIGATIONS, section_id: SEC-DESK-OBLIGATIONS, title: Regulatory and policy obligation mapping, required: true, columns: [{id: obligation_id, label: Obligation ID, required: true}, {id: authority, label: Authority or source, required: true}, {id: citation, label: Citation or internal reference, required: true}, {id: applicability, label: Applicability, required: true}, {id: implementation, label: Implementing action or control, required: true}, {id: owner, label: Evidence owner, required: true}, {id: validation, label: Legal or Compliance validation, required: true}], rubric_criteria: [COM-RAG-001, COM-GOV-001]}
  - {id: TBL-DESK-VERSIONS, section_id: SEC-DESK-VERSION, title: Version history and approvals, required: true, columns: [{id: version, label: Version, required: true}, {id: effective, label: Effective date, required: true}, {id: change, label: Change and operational impact, required: true}, {id: owner, label: Content owner, required: true}, {id: concurrence, label: Risk or Compliance concurrence, required: true}, {id: approver, label: Approval authority, required: true}, {id: supersedes, label: Supersedes, required: true}], rubric_criteria: [COM-GOV-001]}
