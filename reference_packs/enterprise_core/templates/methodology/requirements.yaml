schema_version: "0.1"
template_id: TPL-METHODOLOGY-001
document_type: methodology
version: 2.0.0
description: Enterprise methodology template with risk-based classification, data lineage, independent validation, limitations, monitoring, implementation mapping, and obligation traceability.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-METH-METADATA, heading: "Document metadata and governance", order: 10, required: true, cardinality: one, expected_content: "identity, version, status, classification, legal entities, jurisdictions, inventory ID, risk tier, intended and prohibited use, owner, accountable executive, validation status, approving authority, dates, and supersession", ontology_hooks: [DocumentIdentity, DocumentVersion, Methodology, Model, Approval, Role, Organization], lint_rules: [governance_fields, model_inventory, legal_entity_scope], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-METH-OBJECTIVE, heading: "Objective", order: 20, required: true, cardinality: one, expected_content: "decision, measurement, estimate, or risk-management objective; users; outputs; and success criteria", ontology_hooks: [Methodology, Statement, Output], lint_rules: [objective_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-METH-SCOPE, heading: "Scope and applicability", order: 30, required: true, cardinality: one, expected_content: "legal entities, jurisdictions, businesses, products, populations, periods, intended use, prohibited use, exclusions, model-classification conclusion, materiality, and local overlays", ontology_hooks: [Methodology, Limitation, Organization, Requirement], lint_rules: [scope_boundaries, legal_entity_scope, use_restrictions], rubric_criteria: [COM-SCOPE-001, METH-LIMIT-001]}
  - {id: SEC-METH-FRAMEWORK, heading: "Conceptual framework", order: 40, required: true, cardinality: one, expected_content: "economic, statistical, financial, operational, or risk theory; causal or associational relationships; judgments; and conceptual limits", ontology_hooks: [Methodology, Model, Statement], lint_rules: [framework_coherent, judgment_labeled], rubric_criteria: [COM-EXEC-001, COM-RAG-001]}
  - {id: SEC-METH-DEFINITIONS, heading: "Definitions", order: 50, required: true, cardinality: one, expected_content: "canonical terms, acronyms, symbols, units, taxonomies, materiality, and model or non-model classification", ontology_hooks: [GlossaryTerm], lint_rules: [acronyms_defined, symbols_defined], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-METH-DATA, heading: "Data inputs and lineage", order: 60, required: true, cardinality: one, expected_content: "authoritative sources, legal-entity and period scope, owners, stewards, critical elements, lineage, transformations, quality, reconciliation, classification, residency, fallbacks, and evidence", ontology_hooks: [DataAsset, DataElement, Input, System, Evidence, Organization], lint_rules: [lineage_complete, data_owner, quality_threshold], rubric_criteria: [METH-DATA-001, COM-DEPEND-001]}
  - {id: SEC-METH-PREP, heading: "Data preparation and transformations", order: 70, required: true, cardinality: one, expected_content: "filters, joins, mappings, exclusions, missing values, outliers, adjustments, sampling, transformations, reconciliations, code or query versions, and checks", ontology_hooks: [MethodologyStep, DataElement, Rule, Calculator], lint_rules: [transformation_trace, missing_data_rule], rubric_criteria: [METH-DATA-001, COM-EXEC-001]}
  - {id: SEC-METH-STEPS, heading: "Methodological steps", order: 80, required: true, cardinality: one_or_more, expected_content: "ordered and reproducible steps with inputs, actions, decisions, controls, outputs, completion, and failure handling", ontology_hooks: [MethodologyStep, Input, Output, Decision, Control], lint_rules: [atomic_methods, completion_condition], rubric_criteria: [COM-EXEC-001, METH-MODEL-001]}
  - {id: SEC-METH-MODELS, heading: "Models, formulas, algorithms, parameters, and calculators", order: 90, required: true, cardinality: one, expected_content: "object type, inventory ID, risk tier, purpose, approved use, formula or algorithm, inputs, parameters, units, timing, rounding, owner, developer, implementation, validation, limitations, and fallback", ontology_hooks: [Model, Formula, Parameter, Calculator, Methodology], lint_rules: [formula_units, calculator_inventory, model_inventory], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-ASSUMPTIONS, heading: "Assumptions", order: 100, required: true, cardinality: one, expected_content: "statement, rationale, applicability, period, risk, test, owner, breach action, and evidence", ontology_hooks: [Assumption, Risk, Test, Evidence], lint_rules: [assumption_validation], rubric_criteria: [METH-LIMIT-001]}
  - {id: SEC-METH-PARAMETERS, heading: "Parameter selection and thresholds", order: 110, required: true, cardinality: one, expected_content: "source, estimation or selection, value, unit, period, approval, sensitivity, uncertainty, monitoring, recalibration, override, expiry, and evidence", ontology_hooks: [Parameter, Threshold, Rule, Approval, Evidence], lint_rules: [parameter_provenance, threshold_units], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-RULES, heading: "Decision rules", order: 120, required: true, cardinality: one, expected_content: "conditions, data sources, periods, operators, thresholds, outcomes, branches, overrides, authorities, and evidence", ontology_hooks: [Rule, Decision, Threshold, DataAsset, Approval], lint_rules: [rule_is_testable, decision_authority], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-LIMITATIONS, heading: "Limitations and applicability boundaries", order: 130, required: true, cardinality: one, expected_content: "affected uses and populations, causes, impacts, severity, mitigations, disclosures, owners, monitoring, triggers, and escalation", ontology_hooks: [Limitation, Risk, Control, Role], lint_rules: [limitation_disclosure, use_restrictions], rubric_criteria: [METH-LIMIT-001]}
  - {id: SEC-METH-EXCEPTIONS, heading: "Exceptions and overrides", order: 140, required: true, cardinality: one, expected_content: "affected rule or use, reason, scope, pre- and post-adjustment values, residual risk, authority, compensating controls, period, expiry, monitoring, evidence, and downstream impact", ontology_hooks: [Exception, Approval, Parameter, Risk, Control, Evidence], lint_rules: [exception_authority, overlay_trace], rubric_criteria: [METH-LIMIT-001, COM-CONTROL-001]}
  - {id: SEC-METH-VALIDATION, heading: "Validation and testing", order: 150, required: true, cardinality: one, expected_content: "independence, conceptual soundness, process verification, data, implementation, benchmarking, sensitivity, outcomes analysis, tests, populations, tolerances, results, findings, limitations, remediation, evidence, and next due date", ontology_hooks: [Test, Evidence, Control, Model, Methodology], lint_rules: [test_tolerance, evidence_retention, validation_independence], rubric_criteria: [METH-VALIDATION-001, COM-CONTROL-001]}
  - {id: SEC-METH-MONITORING, heading: "Monitoring metrics and performance tolerances", order: 160, required: true, cardinality: one, expected_content: "population, formula, source, unit, frequency, threshold, owner, forum, breach action, trend, coverage gap, outcomes analysis, recalibration, and evidence", ontology_hooks: [Metric, ServiceLevel, Threshold, DataAsset, Evidence], lint_rules: [metric_unit_period, metric_population], rubric_criteria: [METH-VALIDATION-001, COM-EXEC-001]}
  - {id: SEC-METH-GOVERNANCE, heading: "Governance and approvals", order: 170, required: true, cardinality: one, expected_content: "development owner, user, accountable executive, model or methodology owner, validator, second-line challenge, approving forum, decision rights, conditions, dissent, change authority, records, and review", ontology_hooks: [Role, Approval, Policy, Standard, Organization, Evidence], lint_rules: [approval_record, validation_independence, segregation_of_duties], rubric_criteria: [COM-GOV-001, COM-CONTROL-001]}
  - {id: SEC-METH-IMPLEMENTATION, heading: "Implementation mapping", order: 180, required: true, cardinality: one, expected_content: "methodology objects mapped to production code, systems, calculators, processes, controls, owners, versions, verification, release, fallback, rollback, and evidence", ontology_hooks: [Process, Control, System, Calculator, Model, Methodology, Evidence], lint_rules: [mapping_resolves, implementation_verification], rubric_criteria: [COM-DEPEND-001, COM-EXEC-001]}
  - {id: SEC-METH-RELATED, heading: "Related processes, controls, policies, and standards", order: 190, required: true, cardinality: one, expected_content: "authority and obligation mappings by jurisdiction and legal entity, applicability conclusions, methodology requirements, controls, evidence, interpretation owners, and review dates", ontology_hooks: [Process, Control, Policy, Standard, Requirement, Evidence, Organization], lint_rules: [references_resolve, obligation_mapping], rubric_criteria: [COM-RAG-001, COM-GOV-001]}
  - {id: SEC-METH-VERSION, heading: "Version history", order: 200, required: true, cardinality: one_or_more, expected_content: "change class, rationale, impact, development, independent validation or challenge, approval, conditions, implementation, effective date, evidence, and supersession", ontology_hooks: [DocumentVersion, Approval, Role, Evidence], lint_rules: [version_history, change_classification], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-METH-METADATA, section_id: SEC-METH-METADATA, title: Methodology control, required: true, columns: [{id: methodology_id, label: Methodology ID, required: true}, {id: version, label: Version, required: true}, {id: status, label: Status, required: true}, {id: classification, label: Classification, required: true}, {id: applicability, label: Legal entities and jurisdictions, required: true}, {id: inventory, label: Inventory ID and risk tier, required: true}, {id: intended_use, label: Intended decision or use, required: true}, {id: prohibited_use, label: Prohibited use, required: true}, {id: owner, label: Owner, required: true}, {id: executive, label: Accountable executive, required: true}, {id: validation, label: Validation or challenge status, required: true}, {id: authority, label: Approving authority, required: true}, {id: effective, label: Effective date, required: true}, {id: review, label: Next review date, required: true}], rubric_criteria: [COM-GOV-001, METH-LIMIT-001]}
  - {id: TBL-METH-DATA, section_id: SEC-METH-DATA, title: Data lineage and quality, required: true, columns: [{id: data_id, label: Data ID, required: true}, {id: source, label: Authoritative source, required: true}, {id: scope, label: Legal-entity and period scope, required: true}, {id: owner, label: Owner and steward, required: true}, {id: elements, label: Critical elements, required: true}, {id: lineage, label: Lineage and transformations, required: true}, {id: quality, label: Quality and reconciliation rule, required: true}, {id: classification, label: Classification and residency, required: true}, {id: fallback, label: Approved fallback, required: true}, {id: evidence, label: Evidence, required: true}], rubric_criteria: [METH-DATA-001]}
  - {id: TBL-METH-MODELS, section_id: SEC-METH-MODELS, title: "Model, formula, and implementation inventory", required: true, columns: [{id: object_id, label: Object ID, required: true}, {id: classification, label: Classification and risk tier, required: true}, {id: purpose, label: Purpose and approved use, required: true}, {id: formula, label: Formula or algorithm, required: true}, {id: inputs, label: Inputs and parameters, required: true}, {id: conventions, label: "Units, timing, and rounding", required: true}, {id: owner, label: Owner and developer, required: true}, {id: implementation, label: Implementation or calculator, required: true}, {id: validation, label: Validation status and date, required: true}, {id: limitations, label: Limitations and fallback, required: true}], rubric_criteria: [METH-MODEL-001]}
