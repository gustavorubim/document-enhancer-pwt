schema_version: "0.1"
template_id: TPL-METHODOLOGY-001
document_type: methodology
version: 1.0.0
description: Governed methodology template for data lineage, formulas, validation, and limitations.
rendering: {placeholder_syntax: "{{ dotted.path }}", missing_value: TBD, authoring_comments: stripped}
sections:
  - {id: SEC-METH-METADATA, heading: "Document metadata and governance", order: 10, required: true, cardinality: one, expected_content: "identity, owner, version, status, approvals", ontology_hooks: [DocumentIdentity, DocumentVersion, Approval], lint_rules: [governance_fields], rubric_criteria: [COM-GOV-001, COM-STRUCT-001]}
  - {id: SEC-METH-OBJECTIVE, heading: "Objective", order: 20, required: true, cardinality: one, expected_content: "decision or measurement objective", ontology_hooks: [Methodology, Statement], lint_rules: [objective_is_explicit], rubric_criteria: [COM-SCOPE-001]}
  - {id: SEC-METH-SCOPE, heading: "Scope and applicability", order: 30, required: true, cardinality: one, expected_content: "population, period, exclusions, and applicability boundary", ontology_hooks: [Methodology, Limitation], lint_rules: [scope_boundaries], rubric_criteria: [COM-SCOPE-001, METH-LIMIT-001]}
  - {id: SEC-METH-FRAMEWORK, heading: "Conceptual framework", order: 40, required: true, cardinality: one, expected_content: "concepts and relationships", ontology_hooks: [Methodology, Model, Statement], lint_rules: [framework_coherent], rubric_criteria: [COM-EXEC-001, COM-RAG-001]}
  - {id: SEC-METH-DEFINITIONS, heading: "Definitions", order: 50, required: true, cardinality: one, expected_content: "canonical terminology and acronyms", ontology_hooks: [GlossaryTerm], lint_rules: [acronyms_defined], rubric_criteria: [COM-RAG-001, COM-STYLE-001]}
  - {id: SEC-METH-DATA, heading: "Data inputs and lineage", order: 60, required: true, cardinality: one, expected_content: "sources, owners, fields, period, lineage, and quality", ontology_hooks: [DataAsset, DataElement, Input], lint_rules: [lineage_complete], rubric_criteria: [METH-DATA-001, COM-DEPEND-001]}
  - {id: SEC-METH-PREP, heading: "Data preparation and transformations", order: 70, required: true, cardinality: one, expected_content: "preparation steps, filters, joins, exclusions, and checks", ontology_hooks: [MethodologyStep, DataElement, Rule], lint_rules: [transformation_trace], rubric_criteria: [METH-DATA-001, COM-EXEC-001]}
  - {id: SEC-METH-STEPS, heading: "Methodological steps", order: 80, required: true, cardinality: one_or_more, expected_content: "atomic methods and outputs", ontology_hooks: [MethodologyStep, Input, Output], lint_rules: [atomic_methods], rubric_criteria: [COM-EXEC-001, METH-MODEL-001]}
  - {id: SEC-METH-MODELS, heading: "Models, formulas, algorithms, parameters, and calculators", order: 90, required: true, cardinality: one, expected_content: "formulas, models, parameters, versions, and calculator references", ontology_hooks: [Model, Formula, Parameter, Calculator], lint_rules: [formula_units, calculator_inventory], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-ASSUMPTIONS, heading: "Assumptions", order: 100, required: true, cardinality: one, expected_content: "assumptions, risks, validation, owner, and frequency", ontology_hooks: [Assumption], lint_rules: [assumption_validation], rubric_criteria: [METH-LIMIT-001]}
  - {id: SEC-METH-PARAMETERS, heading: "Parameter selection and thresholds", order: 110, required: true, cardinality: one, expected_content: "parameter source, selection rule, threshold, unit, and authority", ontology_hooks: [Parameter, Threshold, Rule], lint_rules: [parameter_provenance], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-RULES, heading: "Decision rules", order: 120, required: true, cardinality: one, expected_content: "conditions, outcomes, overrides, and evidence", ontology_hooks: [Rule, Decision, Threshold], lint_rules: [rule_is_testable], rubric_criteria: [METH-MODEL-001]}
  - {id: SEC-METH-LIMITATIONS, heading: "Limitations and applicability boundaries", order: 130, required: true, cardinality: one, expected_content: "known limits, impact, mitigation, and disclosure", ontology_hooks: [Limitation], lint_rules: [limitation_disclosure], rubric_criteria: [METH-LIMIT-001]}
  - {id: SEC-METH-EXCEPTIONS, heading: "Exceptions and overrides", order: 140, required: true, cardinality: one, expected_content: "authority, reason, period, and evidence", ontology_hooks: [Exception, Approval], lint_rules: [exception_authority], rubric_criteria: [METH-LIMIT-001, COM-CONTROL-001]}
  - {id: SEC-METH-VALIDATION, heading: "Validation and testing", order: 150, required: true, cardinality: one, expected_content: "tests, tolerances, owners, results, remediation, and evidence", ontology_hooks: [Test, Evidence, Control], lint_rules: [test_tolerance, evidence_retention], rubric_criteria: [METH-VALIDATION-001, COM-CONTROL-001]}
  - {id: SEC-METH-MONITORING, heading: "Monitoring metrics and performance tolerances", order: 160, required: true, cardinality: one, expected_content: "metrics, units, periods, thresholds, and action", ontology_hooks: [Metric, ServiceLevel, Threshold], lint_rules: [metric_unit_period], rubric_criteria: [METH-VALIDATION-001, COM-EXEC-001]}
  - {id: SEC-METH-GOVERNANCE, heading: "Governance and approvals", order: 170, required: true, cardinality: one, expected_content: "owner, approver, review, change authority, and records", ontology_hooks: [Role, Approval, Policy, Standard], lint_rules: [approval_record], rubric_criteria: [COM-GOV-001, COM-CONTROL-001]}
  - {id: SEC-METH-IMPLEMENTATION, heading: "Implementation mapping", order: 180, required: true, cardinality: one, expected_content: "systems, processes, controls, calculators, and owners", ontology_hooks: [Process, Control, System, Calculator], lint_rules: [mapping_resolves], rubric_criteria: [COM-DEPEND-001, COM-EXEC-001]}
  - {id: SEC-METH-RELATED, heading: "Related processes, controls, policies, and standards", order: 190, required: true, cardinality: one, expected_content: "stable references and relationships", ontology_hooks: [Process, Control, Policy, Standard], lint_rules: [references_resolve], rubric_criteria: [COM-RAG-001]}
  - {id: SEC-METH-VERSION, heading: "Version history", order: 200, required: true, cardinality: one_or_more, expected_content: "changes, approvals, dates, and supersession", ontology_hooks: [DocumentVersion, Approval], lint_rules: [version_history], rubric_criteria: [COM-GOV-001]}
tables:
  - {id: TBL-METH-DATA, section_id: SEC-METH-DATA, title: Data lineage, required: true, columns: [{id: data_id, label: Data ID, required: true}, {id: owner, label: Owner, required: true}, {id: fields, label: Fields, required: true}, {id: period, label: Period, required: true}, {id: quality, label: Quality check, required: true}], rubric_criteria: [METH-DATA-001]}
  - {id: TBL-METH-MODELS, section_id: SEC-METH-MODELS, title: Models and formulas, required: true, columns: [{id: object_id, label: Object ID, required: true}, {id: type, label: Type, required: true}, {id: formula, label: Formula or algorithm, required: true}, {id: parameters, label: Parameters, required: true}, {id: calculator, label: Calculator, required: true}, {id: validation, label: Validation status, required: true}], rubric_criteria: [METH-MODEL-001]}
  - {id: TBL-METH-ASSUMPTIONS, section_id: SEC-METH-ASSUMPTIONS, title: Assumptions and limitations, required: true, columns: [{id: assumption_id, label: ID, required: true}, {id: statement, label: Statement, required: true}, {id: risk, label: Risk if violated, required: true}, {id: validation, label: Validation, required: true}, {id: owner, label: Owner, required: true}], rubric_criteria: [METH-LIMIT-001]}
  - {id: TBL-METH-VALIDATION, section_id: SEC-METH-VALIDATION, title: Validation tests, required: true, columns: [{id: test_id, label: Test ID, required: true}, {id: objective, label: Objective, required: true}, {id: tolerance, label: Tolerance, required: true}, {id: owner, label: Owner, required: true}, {id: evidence, label: Evidence, required: true}, {id: result, label: Result, required: true}], rubric_criteria: [METH-VALIDATION-001]}
  - {id: TBL-METH-GOVERNANCE, section_id: SEC-METH-GOVERNANCE, title: Governance approvals, required: true, columns: [{id: role, label: Role, required: true}, {id: decision, label: Decision, required: true}, {id: date, label: Date, required: true}, {id: evidence, label: Evidence, required: true}], rubric_criteria: [COM-GOV-001]}
  - {id: TBL-METH-VERSIONS, section_id: SEC-METH-VERSION, title: Version history, required: true, columns: [{id: version, label: Version, required: true}, {id: effective, label: Effective date, required: true}, {id: change, label: Change, required: true}, {id: approver, label: Approver, required: true}], rubric_criteria: [COM-GOV-001]}
