  - {id: TBL-METH-GOVERNANCE, section_id: SEC-METH-GOVERNANCE, title: Governance decisions, required: true, columns: [{id: role, label: Role or forum, required: true}, {id: capacity, label: Governance capacity or line, required: true}, {id: decision, label: Decision or challenge, required: true}, {id: authority, label: Scope and delegated authority, required: true}, {id: date, label: Date, required: true}, {id: conditions, label: "Conditions, dissent, or limitations", required: true}, {id: evidence, label: Evidence, required: true}], rubric_criteria: [COM-GOV-001, METH-VALIDATION-001]}
