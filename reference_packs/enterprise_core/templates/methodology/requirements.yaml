  - {id: TBL-METH-VALIDATION, section_id: SEC-METH-VALIDATION, title: Validation and testing, required: true, columns: [{id: test_id, label: Test ID, required: true}, {id: component, label: Validation component and independence, required: true}, {id: objective, label: Objective and population, required: true}, {id: method, label: "Method, benchmark, or challenger", required: true}, {id: tolerance, label: Tolerance and decision rule, required: true}, {id: owner, label: Owner, required: true}, {id: result, label: Result and date, required: true}, {id: findings, label: Findings or limitations, required: true}, {id: evidence, label: Evidence and next due, required: true}], rubric_criteria: [METH-VALIDATION-001]}
