schema_version: "1.0"
pack_id: enterprise_core
version: 2.0.0
description: >-
  Fictional, local-first enterprise banking reference context for highly governed process,
  methodology, standard, and desktop-procedure documents. It is designed for G-SIB-scale
  governance patterns, contains no proprietary policy text, and does not establish compliance.
owner:
  name: Enterprise Documentation Council
  team: Governance Enablement
  contact: documentation-council@example.invalid
status: active
effective_from: "2026-07-16"
effective_to: null
supported_document_types:
  process:
    template: templates/process/template.md
    requirements: templates/process/requirements.yaml
    example: templates/process/example.md
  methodology:
    template: templates/methodology/template.md
    requirements: templates/methodology/requirements.yaml
    example: templates/methodology/example.md
  standard:
    template: templates/standard/template.md
    requirements: templates/standard/requirements.yaml
    example: templates/standard/example.md
  desktop_procedure:
    template: templates/desktop_procedure/template.md
    requirements: templates/desktop_procedure/requirements.yaml
    example: templates/desktop_procedure/example.md
applicability:
  default_business_domain: enterprise_operations
  supported_jurisdictions: [US, GLOBAL]
  supported_confidentiality: [public_internal, confidential, restricted]
  default_document_status: draft
precedence:
  order:
    - reviewer_steering
    - regulation
    - policy
    - standard
    - template
    - style_guide
    - source
  conflict_policy:
    same_precedence: error
    higher_precedence: wins_with_notice
    lower_precedence: surface_for_review
    reviewer_steering: explicit_only
context_sources:
  - reference_id: STYLE-CORE-001
    kind: style_guide
    path: context/style_guides/enterprise_style.md
    applies_when: {}
  - reference_id: POL-DOC-GOV-001
    kind: policy
    path: context/policies/document-governance.md
    applies_when:
      tags: [governed_document]
  - reference_id: POL-REC-001
    kind: policy
    path: context/policies/records-retention.md
    applies_when:
      tags: [records]
  - reference_id: STD-OPS-DOC-001
    kind: standard
    path: context/standards/operational-documentation.md
    applies_when:
      document_types: [process, methodology, standard, desktop_procedure]
  - reference_id: STD-CONTROL-EVID-001
    kind: standard
    path: context/standards/control-evidence.md
    applies_when:
      tags: [controlled_activity]
ontology:
  entity_types: ontology/entity_types.yaml
  relationship_types: ontology/relationship_types.yaml
  id_patterns: ontology/id_patterns.yaml
  controlled_terms: ontology/controlled_terms.yaml
glossary: context/glossary/glossary.yaml
style_guide: context/style_guides/enterprise_style.md
rubrics:
  common: rubrics/common.yaml
  process: rubrics/process.yaml
  methodology: rubrics/methodology.yaml
  standard: rubrics/standard.yaml
  desktop_procedure: rubrics/desktop_procedure.yaml
required_acknowledgements:
  - "This pack is fictional reference context and is not a substitute for legal, policy, or control-owner approval."
  - "Legal and Compliance must validate regulatory, jurisdiction, legal-entity, and notification applicability before adoption."
  - "Supervisory publications cited in pack documentation are contextual design inputs, not incorporated obligations or evidence of compliance."
  - "Fictional retention periods, thresholds, role names, systems, and identifiers must be replaced by approved enterprise values."
conflicts:
  - conflict_id: CONFLICT-001
    left: POL-DOC-GOV-001
    right: STD-OPS-DOC-001
    resolution: higher_precedence_wins
    rationale: Policy governance controls the minimum lifecycle fields; the standard supplies executable formatting.
  - conflict_id: CONFLICT-002
    left: POL-REC-001
    right: STD-CONTROL-EVID-001
    resolution: higher_precedence_wins
    rationale: Retention policy controls the minimum retention period when an evidence standard is less specific.
