# Copy to document-enhancer.toml for project-local defaults.
# Secrets do not belong in this file; use provider-native credentials or env vars.

[workspace]
run_dir = ".document-enhancer/runs"
catalog_path = ".document-enhancer/rag/catalog.sqlite3"

[references]
reference_pack = "reference_packs/enterprise_core"
prompt_pack = "prompt_packs/gemini_core"

[gemini]
backend = "developer_api" # developer_api or vertex_ai
developer_model = "gemini-3.5-flash"
structure_model = "gemini-3.1-flash-lite"
rewrite_model = "gemini-3.1-pro-preview"
embedding_model = "gemini-embedding-2"
embedding_dimensions = 768
allow_pro_fallback = false

[policy]
data_handling = "local_first"
external_tracing = false
live_provider_checks = false
