name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      DOCENHANCE_RUN_LIVE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -m "not live_model and not public_download" --cov
      - run: uv build
      - run: uv run --isolated --with ./dist/document_enhancer-0.1.0-py3-none-any.whl docenhance --help
